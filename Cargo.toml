[package]
name = "lightflow-ui"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.29"
egui_node_graph2 = "0.7"
flatbuffers = "25.12.19"
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["CssStyleDeclaration", "Document", "Element", "Headers", "HtmlCanvasElement", "HtmlElement", "Node", "Request", "RequestInit", "RequestMode", "Response", "Window"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
